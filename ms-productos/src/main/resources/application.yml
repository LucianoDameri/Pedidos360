server:
  port: 8082

spring:
  application:
    name: ms-productos
  datasource:
    url: jdbc:mysql://localhost:3306/pedidos360_productos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Configuración Azure AD (IDaaS)
azure:
  activedirectory:
    tenant-id: ${AZURE_TENANT_ID:your-tenant-id}
    client-id: ${AZURE_CLIENT_ID:your-client-id}
    jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:your-tenant-id}/discovery/v2.0/keys
    issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:your-tenant-id}/v2.0
