server:
  port: 8083

spring:
  application:
    name: ms-pedidos
  datasource:
    url: jdbc:mysql://localhost:3306/pedidos360_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    # Cluster de 2 nodos: la app se conecta al primero disponible
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    virtual-host: /
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: manual      # ACK explicito en cada consumidor
        prefetch: 1                   # un mensaje sin confirmar por consumidor
        concurrency: 1
        max-concurrency: 3
        default-requeue-rejected: false  # lo rechazado va a la DLQ, no vuelve a la cola

  # ---------------------------------------------------------------------------
  # Kafka (EP3): cliente productor. Toda la configuracion vive aqui.
  # ---------------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    client-id: ms-pedidos
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                 # el broker confirma cuando las replicas en sincronia recibieron el mensaje
      retries: 3
      properties:
        enable.idempotence: true             # sin duplicados aunque se reintente el envio
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 3000                   # si Kafka no responde, la compra no se queda esperando
        spring.json.add.type.headers: false  # el consumidor tiene su propio DTO: no se envia el tipo Java
    admin:
      fail-fast: false                       # si Kafka tarda en estar listo, la app igual arranca

azure:
  activedirectory:
    tenant-id: ${AZURE_TENANT_ID:37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df}
    client-id: ${AZURE_CLIENT_ID:f2e886fe-a3b6-46fe-affe-61b4ea743f2a}
    jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df}/discovery/v2.0/keys
    issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df}/v2.0

# URLs de los otros microservicios (en docker-compose: nombres de contenedor)
servicios:
  clientes-url: ${CLIENTES_URL:http://localhost:8081}
  productos-url: ${PRODUCTOS_URL:http://localhost:8082}
  inventario-url: ${INVENTARIO_URL:http://localhost:8084}

# ---------------------------------------------------------------------------
# Mensajeria RabbitMQ: TODOS los nombres de exchanges, colas y routing keys
# viven aqui. Las clases Java solo los leen via MessagingProperties.
# ---------------------------------------------------------------------------
app:
  messaging:
    exchanges:
      pedidos: pedidos.exchange
      pagos: pagos.exchange
      dlx: dlx.exchange
    queues:
      tickets-pago: tickets.pago.queue
      tickets-dlq: tickets.dlq
    retention:
      dlq-ttl-ms: 86400000   # los mensajes de las DLQ se conservan 24 h (guia 2.2.3)
    routing-keys:
      pedido-creado: pedido.creado
      pedido-cancelado: pedido.cancelado
      pago-aprobado: pago.aprobado
      tickets-dlq: tickets.dead

  # ---------------------------------------------------------------------------
  # Kafka: topico que produce este servicio (ver docs/KAFKA.md)
  # ---------------------------------------------------------------------------
  kafka:
    topics:
      pedidos-eventos:
        name: pedidos.eventos
        partitions: 3
        replicas: 2
        retention-ms: 604800000     # 7 dias
        cleanup-policy: delete
        min-insync-replicas: 1
