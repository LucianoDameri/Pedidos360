# Cluster RabbitMQ de 2 nodos (rabbit@rabbitmq-1 y rabbit@rabbitmq-2)
# Los nodos se descubren por lista fija de nombres (classic_config).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Limpia nodos desaparecidos cada 10 segundos
cluster_formation.node_cleanup.interval = 10

# Con 2 nodos no hay mayoria posible: ante una particion de red se recupera sola
cluster_partition_handling = autoheal

