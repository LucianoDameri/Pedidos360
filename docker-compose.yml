version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedidos360
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pedidos360-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-clientes:
    build: ./ms-clientes
    container_name: ms-clientes
    restart: always
    ports:
      - "8081:8081"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pedidos360_clientes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-productos:
    build: ./ms-productos
    container_name: ms-productos
    restart: always
    ports:
      - "8082:8082"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pedidos360_productos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-pedidos:
    build: ./ms-pedidos
    container_name: ms-pedidos
    restart: always
    ports:
      - "8083:8083"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pedidos360_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      CLIENTES_URL: http://ms-clientes:8081
      PRODUCTOS_URL: http://ms-productos:8082
      INVENTARIO_URL: http://ms-inventario:8084
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-inventario:
    build: ./ms-inventario
    container_name: ms-inventario
    restart: always
    ports:
      - "8084:8084"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pedidos360_inventario?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-pagos:
    build: ./ms-pagos
    container_name: ms-pagos
    restart: always
    ports:
      - "8085:8085"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pedidos360_pagos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      PEDIDOS_URL: http://ms-pedidos:8083
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    networks:
      - pedidos360-net

  frontend:
    image: caddy:2-alpine
    container_name: pedidos360-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pedidos360-frontend/dist/pedidos360-frontend/browser:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pedidos360-net

  ms-bff:
    build: ./ms-bff
    container_name: ms-bff
    restart: always
    ports:
      - "8080:8080"
    environment:
      BFF_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      CLIENTES_URL: http://ms-clientes:8081
      PRODUCTOS_URL: http://ms-productos:8082
      PEDIDOS_URL: http://ms-pedidos:8083
      INVENTARIO_URL: http://ms-inventario:8084
      PAGOS_URL: http://ms-pagos:8085
    depends_on:
      - ms-clientes
      - ms-productos
      - ms-pedidos
      - ms-inventario
      - ms-pagos
    networks:
      - pedidos360-net

  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: always
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Dashboard (management UI)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: pedidos360_cookie_secreta
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - pedidos360-net

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: always
    ports:
      - "5673:5672"     # AMQP (nodo 2)
      - "15673:15672"   # Dashboard (nodo 2)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: pedidos360_cookie_secreta   # la misma cookie: asi forman cluster
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-rabbit-admin:
    build: ./ms-rabbit-admin
    container_name: ms-rabbit-admin
    restart: always
    ports:
      - "8086:8086"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    networks:
      - pedidos360-net

  # ===========================================================================
  # KAFKA (EP3): ensamble de 3 Zookeeper + 3 brokers + Kafka UI. Convive con RabbitMQ: no
  # comparten red de mensajeria ni puertos y ningun servicio de RabbitMQ cambia.
  #   - Puertos 9092 / 9093: acceso desde la maquina anfitriona (solo desarrollo).
  #   - Entre contenedores se usa kafka-1:29092, kafka-2:29092 y kafka-3:29092.
  # ===========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    hostname: zookeeper
    restart: always
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: "zookeeper:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - pedidos360-net

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper-2
    hostname: zookeeper-2
    restart: always
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: "zookeeper:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zookeeper_data_2:/var/lib/zookeeper/data
      - zookeeper_log_2:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - pedidos360-net

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper-3
    hostname: zookeeper-3
    restart: always
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: "zookeeper:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zookeeper_data_3:/var/lib/zookeeper/data
      - zookeeper_log_3:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - pedidos360-net

  kafka-1:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-1
    hostname: kafka-1
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"     # acceso desde el anfitrion (desarrollo)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Los topicos se crean a proposito (NewTopic en los microservicios, ms-kafka-admin o los scripts)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      # 2 brokers: replicas = 2 y se tolera la caida de uno (min.insync.replicas = 1)
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_JMX_PORT: 9997            # metricas para Kafka UI
      KAFKA_JMX_HOSTNAME: kafka-1
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-1:29092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 40s
    networks:
      - pedidos360-net

  kafka-2:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-2
    hostname: kafka-2
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"     # acceso desde el anfitrion (desarrollo)
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: kafka-2
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-2:29092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 40s
    networks:
      - pedidos360-net

  kafka-3:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-3
    hostname: kafka-3
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"     # acceso desde el anfitrion (desarrollo)
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: kafka-3
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-3:29092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 40s
    networks:
      - pedidos360-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: always
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8090:8080"     # Kafka UI: http://<host>:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      DYNAMIC_CONFIG_ENABLED: "false"
      # Acceso con usuario y clave (igual que el dashboard de RabbitMQ)
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin123
    networks:
      - pedidos360-net

  ms-analitica:
    build: ./ms-analitica
    container_name: ms-analitica
    restart: always
    ports:
      - "8087:8087"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pedidos360_analitica?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-kafka-admin:
    build: ./ms-kafka-admin
    container_name: ms-kafka-admin
    restart: always
    ports:
      - "8088:8088"
    environment:
      APP_CORS_ORIGINS: http://localhost:4200,https://v40douxdrf.execute-api.us-east-1.amazonaws.com,https://${FRONTEND_HOST}
      AZURE_TENANT_ID: 37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df
      AZURE_CLIENT_ID: f2e886fe-a3b6-46fe-affe-61b4ea743f2a
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - pedidos360-net

volumes:
  mysql_data:
  rabbitmq_data_1:
  rabbitmq_data_2:
  zookeeper_data:
  zookeeper_log:
  zookeeper_data_2:
  zookeeper_log_2:
  zookeeper_data_3:
  zookeeper_log_3:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
  caddy_data:
  caddy_config:

networks:
  pedidos360-net:
    driver: bridge
