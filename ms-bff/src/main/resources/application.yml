  services:
    clientes: ${CLIENTES_URL:http://localhost:8081}
    productos: ${PRODUCTOS_URL:http://localhost:8082}
    pedidos: ${PEDIDOS_URL:http://localhost:8083}
    inventario: ${INVENTARIO_URL:http://localhost:8084}
    pagos: ${PAGOS_URL:http://localhost:8085}
