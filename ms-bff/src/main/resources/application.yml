server:
  port: 8080

spring:
  application:
    name: ms-bff

# Configuración Azure AD (IDaaS) - misma app registration que los microservicios
azure:
  activedirectory:
    tenant-id: ${AZURE_TENANT_ID:37e13a6f-33ab-44ae-8cf6-c0f8d4cd40df}
    client-id: ${AZURE_CLIENT_ID:f2e886fe-a3b6-46fe-affe-61b4ea743f2a}
